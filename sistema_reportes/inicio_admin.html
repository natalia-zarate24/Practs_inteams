<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte Técnico Universitario - Panel de administración</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="navbar">
        <div class="navbar-brand">
            <img src="logo.png" alt="Logo Universidad" class="logo">
            <span class="brand-title">Soporte Técnico Universitario</span>
        </div>
        <nav class="navbar-menu">
            <a href="./inicio_admin.html" class="nav-link active">Inicio</a>
            <a href="./usuarios_equipos.html" class="nav-link">Usuarios y equipos</a>
            <a href="./seguimiento.html" class="nav-link">Seguimiento</a>
            <a href="./index.html" class="nav-link">Salir</a>
        </nav>
    </header>

    <main class="main-container-app">
        <div class="section-header">
            <h2>Panel de administración</h2>
            <p>Gestiona el catálogo y atiende las solicitudes.</p>
        </div>

        <div class="home-grid">
            
            <div class="card card-action">
                <div class="section-header" style="margin-bottom: 16px;">
                    <h2>Usuarios y equipos</h2>
                    <p>Registra personas y equipos de cómputo.</p>
                </div>
                <div style="margin-top: 24px;">
                    <a href="usuarios_equipos.html" class="btn btn-general btn-fit">Administrar</a>
                </div>
            </div>

            <div class="card card-action">
                <div class="section-header" style="margin-bottom: 16px;">
                    <h2>Seguimiento</h2>
                    <p>Revisa y actualiza las solicitudes existentes.</p>
                </div>
                <div style="margin-top: 24px;">
                    <a href="seguimiento.html" class="btn btn-admin btn-fit">Ver solicitudes</a>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
