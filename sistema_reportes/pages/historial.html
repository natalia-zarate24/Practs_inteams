<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte Técnico Universitario - Historial</title>
    <link rel="stylesheet" href="../estilos/styles.css">
</head>
<body>

    <header class="navbar">
        <div class="navbar-brand">
            <img src="../assets/images/logo.png" alt="Logo Universidad" class="logo">
            <span class="brand-title">Soporte Técnico Universitario</span>
        </div>
        <nav class="navbar-menu">
            <a href="./inicio_usuario.html" class="nav-link">Inicio</a>
            <a href="./solicitud.html" class="nav-link">Nueva solicitud</a>
            <a href="./historial.html" class="nav-link active">Historial</a>
            <a href="../index.html" class="nav-link">Salir</a>
        </nav>
    </header>

    <main class="main-container-app">
        <div class="section-header">
            <h2>Historial de solicitudes</h2>
            <p>Elige tu nombre para consultar las solicitudes que has generado.</p>
        </div>

        <div class="card" style="margin-bottom: 24px;">
            <div class="form-group" style="margin-bottom: 0;">
                <label for="filtro-usuario">Ver solicitudes de</label>
                <select id="filtro-usuario" class="form-control">
                    <option value="">Todas las personas</option>
                </select>
            </div>
            <div id="aviso" role="status" hidden></div>
        </div>

        <div class="card card-table">
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>N.º</th>
                            <th>Equipo</th>
                            <th>Problema</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="tabla-historial"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="../Scripts/avisos.js"></script>
    <script src="../Scripts/estados.js"></script>
    <script src="../Scripts/historial.js"></script>

</body>
</html>
