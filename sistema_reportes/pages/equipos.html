<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte Técnico Universitario - Equipos</title>
    <link rel="stylesheet" href="../estilos/styles.css">
</head>
<body>

    <header class="navbar">
        <div class="navbar-brand">
            <img src="../assets/images/logo.png" alt="Logo UPQ" class="logo">
            <span class="brand-title">Soporte Técnico Universitario</span>
        </div>
        <nav class="navbar-menu">
            <a href="./inicio_admin.html" class="nav-link">Inicio</a>
            <a href="./usuarios_equipos.html" class="nav-link active">Usuarios y equipos</a>
            <a href="./seguimiento.html" class="nav-link">Seguimiento</a>
            <a href="../index.html" class="nav-link">Salir</a>
        </nav>
    </header>

    <main class="main-container-app">
        <div class="section-header">
            <h2>Equipos</h2>
            <p>Registra un equipo nuevo y consulta el catálogo.</p>
        </div>

        <div class="app-grid">
            
            <div class="card form-card">
                <form id="form-equipo" method="POST" novalidate>
                    <div class="form-group">
                        <label for="nombre-equipo">Nombre del equipo</label>
                        <input type="text" id="nombre-equipo" name="nombre" class="form-control" placeholder="Ej. Laptop LAB-03">
                    </div>

                    <div class="form-group">
                        <label for="stock">Stock</label>
                        <input type="number" id="stock" name="stock" class="form-control" value="1" min="0">
                    </div>

                    <div class="form-group">
                        <label for="descripcion-equipo">Descripción</label>
                        <textarea id="descripcion-equipo" name="descripcion" class="form-control textarea" placeholder="Marca, modelo, ubicación"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-general">Agregar equipo</button>
                    </div>

                    <div id="aviso" role="status" hidden></div>

                </form>
            </div>

            <!-- Tabla de catálogo de equipos -->
            <div class="card table-card">
                <div class="table-responsive">
                    <table class="styled-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Stock</th>
                                <th>Descripción</th>
                            </tr>
                        </thead>
                           <tbody id="tabla-equipos"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script src="../Scripts/avisos.js"></script>
    <script src="../Scripts/equipos.js"></script>

</body>
</html>
