<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento de Solicitudes - Soporte Técnico Universitario</title>
    <link rel="stylesheet" href="../estilos/styles.css">
</head>
<body>

    <header class="navbar">
        <div class="navbar-brand">
            <img src="../assets/images/logo.png" alt="Logo UPQ" class="logo">
            <span class="brand-title">Soporte Técnico Universitario</span>
        </div>
        <nav class="navbar-menu">
            <a href="./inicio_admin.html" class="nav-link">Inicio</a>
            <a href="./usuarios_equipos.html" class="nav-link">Usuarios y equipos</a>
            <a href="./seguimiento.html" class="nav-link active">Seguimiento</a>
            <a href="../index.html" class="nav-link">Salir</a>
        </nav>
    </header>

    <main class="main-container-app">
        <header class="section-header">
            <h2>Seguimiento de solicitudes</h2>
            <p>Selecciona una solicitud para actualizar su estado.</p>
        </header>

        <div id="aviso" role="status" hidden></div>

        <div class="card card-table">
            <div class="table-responsive">
                <table class="styled-table">
                    <thead>
                        <tr>
                            <th>N.º</th>
                            <th>Usuario</th>
                            <th>Equipo</th>
                            <th>Problema</th>
                            <th>Estado</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="tabla-seguimiento"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="../Scripts/avisos.js"></script>
    <script src="../Scripts/estados.js"></script>
    <script src="../Scripts/seguimiento.js"></script>

</body>
</html>
